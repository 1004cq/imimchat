# Nginx stream 配置片段 — MTProto TCP 转发
# 将以下内容加入 /etc/nginx/nginx.conf 的 stream {} 块
# MTProto 为纯 TCP，不能走 HTTP server/location

stream {
    upstream imimchat_mtproto {
        server 127.0.0.1:10443;
        # Teamgram 全栈部署时改为 Teamgram 容器地址
        # server 127.0.0.1:10443;
    }

    server {
        listen 10443;
        proxy_pass imimchat_mtproto;
        proxy_connect_timeout 10s;
        proxy_timeout 600s;
    }
}
