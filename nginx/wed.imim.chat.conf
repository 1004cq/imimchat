# imimchat Nginx 反向代理配置
# 域名: wed.imim.chat
# 更新日期: 2026-04-04

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name wed.imim.chat;
    return 301 https://wed.imim.chat$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl;
    server_name wed.imim.chat;

    # SSL 证书
    ssl_certificate /etc/nginx/ssl/wed.imim.chat.crt;
    ssl_certificate_key /etc/nginx/ssl/wed.imim.chat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传文件大小限制
    client_max_body_size 200M;

    # 管理后台静态资源（/admin/static/ -> 端口 83 /static/）
    location /admin/static/ {
        proxy_pass http://127.0.0.1:83/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台 tsdd-config.js
    location /admin/tsdd-config.js {
        proxy_pass http://127.0.0.1:83/tsdd-config.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 管理后台 logo
    location /admin/logo.png {
        proxy_pass http://127.0.0.1:83/logo.png;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 管理后台 API（/admin/api/ -> 端口 83 /api/）
    location /admin/api/ {
        proxy_pass http://127.0.0.1:83/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台主入口（/admin -> 端口 83，使用 sub_filter 替换资源路径）
    # 精确匹配 /admin，重定向到带 hash 的路径
    location = /admin {
        return 301 /admin/#/;
    }

    location /admin {
        proxy_pass http://127.0.0.1:83/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 替换 HTML 中的绝对路径为 /admin 前缀，并注入 base href
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<head>' '<head><base href="/admin/">';
        sub_filter 'src="/static/' 'src="/admin/static/';
        sub_filter 'href="/static/' 'href="/admin/static/';
        sub_filter 'href="/logo.png"' 'href="/admin/logo.png"';
        sub_filter 'src="/logo.png"' 'src="/admin/logo.png"';
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # WuKongIM WebSocket 代理（wss://wed.imim.chat/ws -> 5200）
    location /ws {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # 业务 API 代理（https://wed.imim.chat/api/ -> 8090）
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # v1 API 直接代理
    location /v1/ {
        proxy_pass http://127.0.0.1:8090/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Web 前端（https://wed.imim.chat -> 端口 82）
    location / {
        proxy_pass http://127.0.0.1:82;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}
