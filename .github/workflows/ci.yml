name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cqim-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cqim-app/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      - name: Typecheck
        run: npm run check
        continue-on-error: true

  gateway:
    name: go-gateway build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build gateway
        working-directory: cqim-app/go-gateway
        run: go build -o /tmp/cqim-gateway .
        continue-on-error: true
