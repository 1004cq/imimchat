# Optional partial /api cutover (opt-in). Production default remains Node:
# this file is NOT used until copied over nginx/default.conf.
#
# Activate:
#   cp nginx/default.go-api-cutover.conf nginx/default.conf && docker compose up -d nginx
# Rollback:
#   cp nginx/default.node-all-api.conf nginx/default.conf && docker compose up -d nginx
#
# Locations follow go-api handlers that actually exist (README + code), not aspirational
# admin/moments/media. /signal is unchanged (Node). /ws stays go-gateway.
#
# `me` is bounded so /api/media does not match.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# GET /api/chat/{chatId} is implemented in go-api; DELETE stays on Node.
map $request_method $chat_detail_to_go_api {
    GET     1;
    default 0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name im.cq.je localhost _;

    client_max_body_size 200M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Unchanged: Node /signal WebSocket. Do not retarget to go-api or C++.
    location /signal {
        proxy_pass http://cqim:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Unchanged: Go gateway group WebSocket.
    location /ws {
        proxy_pass http://go-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Implemented go-api prefixes. /api/media does not match `me`.
    location ~ ^/api/(health|me|presence|friend|apns)(/|$) {
        proxy_pass http://go-api:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        client_max_body_size 200M;
    }

    location ~ ^/api/chat/(create|list|send)$ {
        proxy_pass http://go-api:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        client_max_body_size 200M;
    }

    location ~ ^/api/chat/[^/]+/messages/?$ {
        proxy_pass http://go-api:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        client_max_body_size 200M;
    }

    # GET /api/chat/{chatId} → go-api; DELETE and other methods stay Node.
    # POST /api/chat/{id}/read and /recall stay Node via the catch-all /api below.
    location ~ ^/api/chat/[^/]+$ {
        error_page 418 = @go_api_migrated;
        if ($chat_detail_to_go_api) {
            return 418;
        }
        proxy_pass http://cqim:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        client_max_body_size 200M;
    }

    location @go_api_migrated {
        proxy_pass http://go-api:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        client_max_body_size 200M;
    }

    # Remaining /api (auth, admin, moments, media, group, stickers, qr, web-push, …) → Node.
    location /api {
        proxy_pass http://cqim:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        client_max_body_size 200M;
    }

    location / {
        proxy_pass http://cqim:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 200M;
    }
}
