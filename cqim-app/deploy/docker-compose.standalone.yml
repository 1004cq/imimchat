# 单机独立部署：SQLite + Redis + Node + Go Gateway + Nginx
# 不与现有双节点/NFS/外网 Redis 互通
#
# 用法（在 cqim-app 目录）：
#   cp deploy/env.standalone.example .env
#   docker compose -f deploy/docker-compose.standalone.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    container_name: cqim-standalone-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  cqim:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prebuilt
    image: cqim:standalone
    container_name: cqim-standalone-api
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/cqim.db
      REDIS_URL: redis://redis:6379
      MYSQL_AUDIT_ENABLED: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://103.24.217.244:999}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://103.24.217.244:999}
      GATEWAY_ID: ${GATEWAY_ID:-gw-standalone-1}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s

  go-gateway:
    build:
      context: ../go-gateway
      dockerfile: Dockerfile
    image: cqim-gateway:standalone
    container_name: cqim-standalone-gateway
    restart: unless-stopped
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
      cqim:
        condition: service_healthy
    environment:
      GATEWAY_ID: ${GATEWAY_ID:-gw-standalone-1}
      DB_PATH: /app/data/cqim.db
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://103.24.217.244:999}
    volumes:
      - app_data:/app/data

  nginx:
    image: nginx:stable-alpine
    container_name: cqim-standalone-nginx
    restart: unless-stopped
    ports:
      - "999:80"
    volumes:
      - ./nginx-standalone.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cqim:
        condition: service_healthy
      go-gateway:
        condition: service_started

volumes:
  redis_data:
  app_data:
