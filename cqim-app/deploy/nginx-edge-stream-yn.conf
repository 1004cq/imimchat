# Yunnan (YN) public edge: TLS/HTTP passthrough to Hong Kong (HK) via WireGuard.
# Purpose: if DNS A still includes YN's public IP, browsers hit this host and must
# reach the same origin as HK (same cert + same static HTML/JS). Do NOT terminate
# TLS or serve a second copy of the SPA here — dual static trees cause blank pages.
#
# Install on YN (example path /etc/nginx/nginx.conf stream{} block):
#   1. apt install nginx libnginx-mod-stream   # if needed
#   2. merge the stream{} block below into nginx.conf (top-level, sibling of http{})
#   3. ufw allow 80/tcp && ufw allow 443/tcp
#   4. nginx -t && systemctl reload nginx
#
# Preferred DNS long-term: only A → HK public IP (103.24.217.244). Keep this edge
# as a safety net while dual A records exist, or for regional failover drills.
#
# Replace 10.66.66.1 with the HK WireGuard address if your mesh differs.

stream {
  upstream hk_https {
    server 10.66.66.1:443;
  }
  upstream hk_http {
    server 10.66.66.1:80;
  }

  server {
    listen 443;
    proxy_pass hk_https;
    proxy_connect_timeout 5s;
    proxy_timeout 3600s;
  }

  server {
    listen 80;
    proxy_pass hk_http;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
  }
}
