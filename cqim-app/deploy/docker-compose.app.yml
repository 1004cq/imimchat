# 节点2 应用层 Compose 覆盖（仅 cqim + go-gateway，数据层在节点1 / 腾讯云 PG）
#
# 用法（在节点2 的部署目录，与 docker-compose.yml 一起）：
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d cqim go-gateway
#
# 前置条件：
#   - 节点1 Redis 已对节点2 开放（默认 6380）
#   - Prisma DATABASE_URL 指向腾讯云 PostgreSQL（两节点同一库）。禁止 file:*.db / mongodb://
#   - 禁止 NFS 共享 .db 当主库。/app/data 仅媒体等文件，不是 Prisma 库
#   - 节点2 的 3011、8082 已对节点1 可达（见 docs/TWO_NODES.md）

services:
  nginx:
    profiles: ["disabled"]

  mongo:
    profiles: ["disabled"]

  postgres:
    profiles: ["disabled"]

  redis:
    profiles: ["disabled"]

  mysql:
    profiles: ["disabled"]

  cqim:
    container_name: cqim-node2-api
    image: cqim:latest
    ports:
      - "0.0.0.0:3011:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Prisma 主库 = PostgreSQL。禁止 file:/app/data/cqim.db 与 mongodb://（Mongo 不是 Prisma 主库）。
      DATABASE_URL: ${DATABASE_URL:-postgresql://USER:PASS@TENCENT_PG_HOST:5432/cqim?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://NODE1_HOST:6380}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://wed.imim.chat}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://wed.imim.chat}
    volumes:
      - ${SHARED_DATA_DIR:-/home/ubuntu/cqim_shared/data}:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  go-gateway:
    container_name: cqim-node2-gateway
    image: cqim-gateway:latest
    ports:
      - "0.0.0.0:8082:8081"
    environment:
      GATEWAY_ID: ${GATEWAY_ID:-gw-app-2}
      REDIS_ADDR: ${REDIS_ADDR:-NODE1_HOST:6380}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://wed.imim.chat}
    depends_on:
      cqim:
        condition: service_healthy
