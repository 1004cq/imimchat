# CQIM 双节点入口 Nginx 片段（部署在节点1 宿主机 Nginx）
#
# 用法：
#   1. 将 NODE2_HOST 替换为节点2 内网可达地址（同 VPC 用内网 IP，否则用公网 IP + 安全组仅放行节点1）
#   2. 在 http {} 块 include 本文件，或在 server {} 前粘贴 upstream 段
#   3. 将 im.cq.je server 块中对应 location 的 proxy_pass 改为下方 upstream 名称
#
# 架构：EdgeOne → 仅回源节点1 → 本配置将 /api、/、/signal、/ws/group 分发到两台应用节点

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API 与静态页面：最少连接
upstream cqim_api_nodes {
    least_conn;
    server 127.0.0.1:3011 max_fails=3 fail_timeout=30s;
    server NODE2_HOST:3011 max_fails=3 fail_timeout=30s;
}

# /signal WebSocket：按客户端 IP 粘性，避免同用户连接在节点间漂移
upstream cqim_signal_nodes {
    ip_hash;
    server 127.0.0.1:3011 max_fails=3 fail_timeout=30s;
    server NODE2_HOST:3011 max_fails=3 fail_timeout=30s;
}

# Go Gateway 群聊 WebSocket：按客户端 IP 粘性
upstream gateway_ws_nodes {
    ip_hash;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;
    server NODE2_HOST:8082 max_fails=3 fail_timeout=30s;
}

