# CQIM 单区域多机入口示例（Nginx）
#
# 架构：
#   用户 → LB / Nginx → API upstream（无状态，least_conn）
#                     → /signal upstream（长连接，least_conn 或 ip_hash）
#                     → /ws/group → Go Gateway upstream
#   所有节点共享同一 PostgreSQL + Redis + MinIO
#
# 用法：
#   1. 将 HOST_A / HOST_B 换成两台应用机可达地址
#   2. include 本文件的 upstream，或粘贴到 nginx.conf
#   3. server {} 内使用下方 location
#
# 回滚到单节点：
#   - upstream 只留一台 server；或
#   - 改回 proxy_pass http://127.0.0.1:3011 / 8082；或
#   - 去掉 docker-compose.multi.yml，只起 go-gateway 一份

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API / 静态：无状态，最少连接
upstream cqim_api_nodes {
    least_conn;
    server HOST_A:3011 max_fails=3 fail_timeout=30s;
    server HOST_B:3011 max_fails=3 fail_timeout=30s;
}

# /signal WebSocket：长连接优先 least_conn（也可用 ip_hash 粘性）
upstream cqim_signal_nodes {
    least_conn;
    # ip_hash;  # 若需要同客户端粘性，改用 ip_hash 并去掉 least_conn
    server HOST_A:3011 max_fails=3 fail_timeout=30s;
    server HOST_B:3011 max_fails=3 fail_timeout=30s;
}

# Go Gateway 群聊 WebSocket
upstream gateway_ws_nodes {
    least_conn;
    server HOST_A:8082 max_fails=3 fail_timeout=30s;
    server HOST_B:8082 max_fails=3 fail_timeout=30s;
}

