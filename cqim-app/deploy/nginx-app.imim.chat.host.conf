# Hong Kong (HK) host Nginx (Baota /www/server/panel/vhost/nginx/app.imim.chat.conf)
# Terminates TLS for app.imim.chat and proxies everything to the local Docker nginx
# bound on 127.0.0.1:18080 (compose maps host 18080→container 80).
#
# CRITICAL: Baota global proxy.conf often enables proxy_cache. Without proxy_cache off,
# hashed JS/CSS can be served stale for a day+ after deploys (blank or mixed assets).
#
# Cert paths are on the HK host under /opt/imimchat (not committed).

server {
    listen 80;
    server_name app.imim.chat;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/imimchat/cqim-app/certbot/www;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.imim.chat;
    client_max_body_size 120m;
    ssl_certificate     /opt/imimchat/cqim-app/certbot/conf/live/app.imim.chat/fullchain.pem;
    ssl_certificate_key /opt/imimchat/cqim-app/certbot/conf/live/app.imim.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
    }
}
