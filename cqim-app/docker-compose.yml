version: '3.9'

# Prisma 主库 = PostgreSQL。Mongo 不是 Prisma 主库，禁止把 mongodb:// 填进 DATABASE_URL。
# 禁止 file:*.db / NFS 共享 SQLite。生产 wed 应把 DATABASE_URL 指腾讯云 PG 内网，见 docs/MIGRATE_POSTGRES.md。

services:
  nginx:
    image: nginx:stable-alpine
    container_name: cqim-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - cqim
      - go-gateway

  # 遗留/可选。不是 Prisma 主库。禁止 mongodb:// 写入 DATABASE_URL。
  mongo:
    image: mongo:7
    container_name: cqim-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    # Removed public ports for security
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }\" | grep 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

  # 本地/单机 Prisma 示例。生产请用腾讯云 PostgreSQL 内网，不要把这个容器当 wed 主库。
  postgres:
    image: postgres:16-alpine
    container_name: cqim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cqim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cqim}
      POSTGRES_DB: ${POSTGRES_DB:-cqim}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cqim-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Removed public ports for security
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: cqim-mysql
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cqim_audit}
      MYSQL_USER: ${MYSQL_USER:-cqim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cqim}
    # Removed public ports for security
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  cqim:
    build:
      context: .
      dockerfile: Dockerfile
    image: cqim:latest
    container_name: cqim
    restart: unless-stopped
    # Removed public ports, access via nginx
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Prisma 主库必须是 postgresql:// 。禁止 mongodb:// 与 file:*.db。
      DATABASE_URL: ${DATABASE_URL:-postgresql://cqim:cqim@postgres:5432/cqim?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MYSQL_URL: ${MYSQL_URL:-mysql://cqim:cqim@mysql:3306/cqim_audit}
      MYSQL_AUDIT_ENABLED: ${MYSQL_AUDIT_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://wed.imim.chat}
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  go-gateway:
    build:
      context: ./go-gateway
      dockerfile: Dockerfile
    image: cqim-gateway:latest
    container_name: cqim-gateway
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - GATEWAY_ID=${GATEWAY_ID:-gw-app-1}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - CORS_ORIGINS=${CORS_ORIGINS:-https://wed.imim.chat,http://wed.imim.chat}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  mysql_data:
