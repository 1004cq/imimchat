version: "3.9"

services:
  nginx:
    image: nginx:stable-alpine
    container_name: cqim-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - cqim
      - go-gateway

  postgres:
    image: postgres:16-alpine
    container_name: cqim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cqim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cqim}
      POSTGRES_DB: ${POSTGRES_DB:-cqim}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqim -d cqim"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cqim-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  cqim:
    build:
      context: .
      dockerfile: Dockerfile
    image: cqim:latest
    container_name: cqim
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://cqim:cqim@postgres:5432/cqim?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MEDIA_ROOT: /app/data/media
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://wed.imim.chat}
      TRTC_SDK_APP_ID: ${TRTC_SDK_APP_ID:-1600159677}
      MYSQL_AUDIT_ENABLED: "false"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  go-gateway:
    build:
      context: ./go-gateway
      dockerfile: Dockerfile
    image: cqim-gateway:latest
    container_name: cqim-gateway
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - GATEWAY_ID=${GATEWAY_ID:-gw-app-1}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - CORS_ORIGINS=${CORS_ORIGINS:-https://wed.imim.chat,http://wed.imim.chat}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
