<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2868" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="imimchat" />
    <title>imimchat</title>
    <meta name="description" content="自托管、端对端加密、微信风格的开源即时通讯系统" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-touch-icon-76x76.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link href="https://cdn.bootcdn.net/ajax/libs/lxgw-wenkai-webfont/1.7.0/lxgwwenkai-regular.css" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <!-- 移动端 PWA/Safari 强缓存兜底：版本变更时清缓存并刷新一次 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function () {
        var BUILD = '20260829-direct-v2';
        var KEY = 'cqim_app_build';
        var RELOAD_KEY = 'cqim_build_reload';
        try {
          if (localStorage.getItem(KEY) !== BUILD) {
            localStorage.setItem(KEY, BUILD);
            if ('caches' in window) {
              caches.keys().then(function (names) {
                names.forEach(function (n) { caches.delete(n); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if (sessionStorage.getItem(RELOAD_KEY) !== BUILD) {
              sessionStorage.setItem(RELOAD_KEY, BUILD);
              location.reload();
            }
          } else {
            sessionStorage.removeItem(RELOAD_KEY);
          }
        } catch (e) { /* ignore quota / private mode */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
