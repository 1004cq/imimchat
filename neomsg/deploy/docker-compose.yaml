# NeoMsg 一键部署
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neomsg
      POSTGRES_USER: neomsg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neomsg_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neomsg"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

  neomsg-gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: neomsg-gateway
    ports:
      - "8080:8080"   # WebSocket
      - "5222:5222"   # TCP
    environment:
      POSTGRES_DSN: postgres://neomsg:${POSTGRES_PASSWORD:-neomsg_dev}@postgres:5432/neomsg?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-change-me}
      WS_ADDR: ":8080"
      TCP_ADDR: ":5222"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  neomsg-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: neomsg-api
    ports:
      - "8090:8090"
    environment:
      POSTGRES_DSN: postgres://neomsg:${POSTGRES_PASSWORD:-neomsg_dev}@postgres:5432/neomsg?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      API_ADDR: ":8090"
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: neomsg-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  natsdata:
